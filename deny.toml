[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rsa implementation vulnerable to Marvin attack, a side-channel timing attack; fix is included in rsa v0.10 (currently a release candidate)
    "RUSTSEC-2023-0071", # openidconnect depends on rsa

    # crypto-bigint 0.5 is not constant-time; fix is in 0.7.6, which needs elliptic-curve 0.14.
    # openidconnect 4.0.1 and jsonwebtoken 11.1 (both latest) still pin p256/p384 0.13.
    # openidconnect signs with RS256 only and its EC code only verifies public signatures.
    # web-push-native 0.5 (latest) pins p256 0.13 as well, and there EC code does handle secrets:
    # the VAPID key signs ES256 and every push draws a fresh ECDH key. A timing attack would have
    # to measure the push requests mtg sends, which leave the service asynchronously.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
private = { ignore = true }
clarify = []
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]


[sources]
unknown-git = "deny"
