de: "Command Zone Dating: Farben, Bracket, Budget und Salz im Dating-Profil lassen sich antippen und überschreiben deine Decks; Themes, die nicht dein Ding sind, schließt du aus. Filter für jetzt und für immer liegen in einem Blatt."
en: "Command Zone Dating: tap colors, bracket, budget and salt in your dating profile to override your decks, and rule out themes that aren't your thing. Filters for now and for always share one sheet."
