kind: improved
de: "Die Deck-Sammlung heißt jetzt Physisches Deck und entsteht mit der ersten Karte, die du ins Deck legst. Beim Auflösen wandern die Karten zurück in ihre Sammlungen, und ein anderes Printing im Deck ändert die Deckliste nicht mehr."
en: "The deck collection is now the Physical deck, and it starts with the first card you put into the deck. Taking it apart sorts the cards back into their collections, and another printing in the deck no longer changes the decklist."
