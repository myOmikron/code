kind: new
de: Spieler droppen sich jederzeit selbst aus einem laufenden Turnier, und Organisatoren können Spieler droppen oder nach der ersten Runde noch Nachzügler hinzufügen. Gedroppte Spieler bleiben mit ihren Ergebnissen in der Tabelle.
en: Players drop out of a running tournament themselves at any time, and organizers can drop players or add latecomers after the first round. Dropped players keep their results in the standings.
