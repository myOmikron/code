kind: improved
de: Beim Swipen kommen zuerst ganze Pakete passend zu den Themen deines Decks. Tippe Karten an, die du nicht willst, und swipe den Rest auf einmal ins Deck.
en: Swiping starts with whole packages that match your deck's themes. Tap the cards you don't want and swipe the rest into the deck at once.
