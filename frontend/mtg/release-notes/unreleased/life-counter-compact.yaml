kind: improved
de: Der Lifecounter zeigt „Du“ und dein Gegenüber statt Spielernummern und lässt den Spielfeldern mehr Platz. Im Turnier füllt er den ganzen Bildschirm, zeigt bei 0 Leben Sieg und Niederlage an, nimmt den Sieger mit einem Tipp auf sein Feld entgegen und startet gleich das nächste Spiel.
en: The life counter shows you and your opponent instead of player numbers and leaves more room for the tiles. In a tournament it fills the whole screen, shows victory and defeat when a player reaches 0 life, takes the winner with a tap on their tile and starts the next game right away.
