kind: new
de: Ein Turnier, das auf Papier gespielt wurde, lässt sich nachträglich eintragen, auch mit einem Datum in der Vergangenheit. Organisatoren tragen jede Paarung und jedes Ergebnis selbst ein.
en: A tournament played on paper can be entered afterwards, also with a date in the past. Organizers enter every pairing and result themselves.
