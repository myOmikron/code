kind: new
de: Ist ein Turnier beendet, stehen die Listen der Spieler neben der Tabelle, sofern sie sie teilen; öffentliche Decks sind geteilt, solange du nichts anderes wählst. Organisatoren sehen Warnungen, wenn ein Deck nicht zum Format des Turniers passt.
en: Once a tournament is finished, the players' lists appear next to the standings if they share them; public decks are shared unless you choose otherwise. Organizers see warnings when a deck does not fit the tournament's format.
