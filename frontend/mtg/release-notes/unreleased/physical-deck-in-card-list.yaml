kind: improved
de: Beschaffen ist in die Kartenliste gezogen. Der Schalter Physisch (B) zeigt an jeder Karte, was im Physischen Deck liegt, das Kartenmenü besorgt sie, und X legt wieder Proxies hinein oder nimmt sie heraus. Alles, was das ganze Deck betrifft, öffnest du über die Abweichung im Deckkopf.
en: Sourcing moved into the card list. The Physical switch (B) shows on every card what lies in the Physical deck, the card menu sources it, and X puts Proxies in or takes them out again. Everything about the whole deck opens from the Deviation in the deck header.
