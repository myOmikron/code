kind: new
de: Der Deckberater kennt die Themen „-1/-1 counters“, „Discard“, „Clones“ und „Cascade & discover“, zum Beispiel für Hapatra, Hashaton, Etali oder Yidris. Klone zählen nicht mehr als Spellslinger, und Yawgmoth gilt nicht mehr als Typal-Deck.
en: The deck advisor knows the -1/-1 counters, Discard, Clones and Cascade & discover themes, for example for Hapatra, Hashaton, Etali or Yidris. Clones no longer count as spellslinger, and Yawgmoth is no longer read as a Typal deck.
