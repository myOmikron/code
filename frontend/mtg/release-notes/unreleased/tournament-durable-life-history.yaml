kind: new
de: Eine bewusst gewählte Aufnahme auf einem Gerät speichert den Lebenspunkteverlauf eines Matches dauerhaft. Die Mitspielenden und Turnierorganisatoren können die gespeicherten Spiele auch nach dem Turnier ansehen.
en: Choose one recording device to save a match's life history durably. Its players and tournament organizers can view saved games even after the tournament finishes.
