kind: new
de: Turniere können eine Startgebühr haben. Organisatoren haken ab, wer bezahlt hat, und nur wer bezahlt hat, wird ausgelost; wer bezahlt hat, sehen nur die Organisatoren.
en: Tournaments can have an entry fee. Organizers tick off who has paid, and only those who paid are paired; only organizers see who has paid.
