kind: new
de: Teile ein Deck mit bestimmten Personen, indem du sie über ihren Benutzernamen als Mitwirkende hinzufügst. Sie finden es unter „Mit mir geteilt“ in ihren Decks, auch wenn es privat ist, bauen es als Bearbeiter mit dir zusammen, samt der Tags nur für dieses Deck, und können es jederzeit wieder verlassen.
en: Share a deck with specific people by adding them as collaborators by their username. They find it under “Shared with me” in their decks, even while it is private, build it together with you as editors, tags for this deck included, and can leave it at any time.
