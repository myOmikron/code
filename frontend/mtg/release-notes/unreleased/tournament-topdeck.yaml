kind: new
de: Turniere an Tischen für drei bis fünf Spieler lassen sich nach TopDeck-Regeln spielen. Die Auslosung meidet wiederholte Gegner, wechselt ab, wer anfängt, und die Tabelle entscheidet Gleichstände nach der Siegquote der Gegner.
en: Tournaments at tables for three to five players can be played under TopDeck rules. Pairings avoid repeat opponents, rotate who goes first, and the standings break ties by the opponents' win rate.
