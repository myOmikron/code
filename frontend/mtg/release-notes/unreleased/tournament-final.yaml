kind: new
de: Multiplayer-Turniere können mit einem Finale der Besten an einem Tisch enden, die Sitze nach der Tabelle. Ein unentschiedenes Finale gewinnt, wer in den Schweizer Runden vorne lag.
en: Multiplayer tournaments can end with a final of the best at one table, seated by the standings. A drawn final goes to whoever finished ahead in the Swiss rounds.
