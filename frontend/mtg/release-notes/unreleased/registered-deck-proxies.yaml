kind: improved
de: "Dein angemeldetes Deck merkt sich, wie viele Karten jeder Zeile Proxies in deinem Physischen Deck sind; ab der ersten Runde bleibt diese Zahl wie gespielt. Die Liste des Decks zeigt sie überall dort, wo sie sichtbar ist."
en: "A deck registered for a Tournament remembers how many copies of each line are Proxies in your Physical deck; from the first Round on that count stays as played. The deck's list shows it wherever the list is visible."
