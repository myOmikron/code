kind: new
de: Der Deckberater kennt die Themen „Flyers“, „Theft“, „Goad“ und „X spells“, zum Beispiel für Derevi, Gonti, Marisi oder Zaxara. „Discard“ zählt auch Karten, die davon profitieren, dass Gegner Karten abwerfen (Kefka, Tergrid), und „Wheels“ erkennt Decks wie The Locust God.
en: The deck advisor knows the Flyers, Theft, Goad and X spells themes, for example for Derevi, Gonti, Marisi or Zaxara. Discard also counts cards that profit from opponents discarding (Kefka, Tergrid), and Wheels recognises decks like The Locust God.
