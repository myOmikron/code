kind: new
de: Organisatoren können den Rundentimer pausieren, fortsetzen, Minuten hinzufügen oder abziehen und ihn zurücksetzen. Alle sehen die Änderung sofort, auch im Lebenszähler.
en: Organizers can pause and resume the Round timer, add or take away minutes and reset it. Everyone sees the change at once, including in the life counter.
