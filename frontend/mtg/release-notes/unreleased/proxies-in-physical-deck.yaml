kind: new
de: "Fehlt dir eine Karte, legst du im Reiter „Beschaffen“ des Decks einen Proxy für sie ins Physische Deck. Ein eigener Block zeigt deine Proxies mit Kaufpreis und den Kopien aus deinen Sammlungen, die sie mit einem Klick ersetzen; Proxies zählen nie zu deinem Bestand."
en: "Missing a card? Put a Proxy for it into the Physical deck from the deck's Sourcing tab. A block of its own lists your Proxies with their buy price and the copies in your collections that replace them in one click; Proxies never count towards your cards."
