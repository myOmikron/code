kind: improved
de: Karten, die nur mit ihrem Namen kommen (Deck-Import, Sammlungs-Import, Deck-Berater), bekommen jetzt das neueste erschienene, legale Printing ohne Foil, bei gleich neuen das günstigste, statt des ältesten.
en: Cards given by name alone (deck import, collection import, deck advisor) now get the newest released, legal non-foil printing, the cheapest of equally new ones, instead of the oldest.
