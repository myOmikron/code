kind: new
de: Eins-gegen-eins-Turniere lassen sich jetzt spielen. mtg lost die Schweizer Runden ohne erneute Paarungen aus, die Organisatoren tragen die Ergebnisse ein, und die Tabelle zeigt die Matchpunkte.
en: One-on-one tournaments can now be played. mtg pairs the Swiss rounds without repeat pairings, organizers enter the results, and the standings show the match points.
