de: Der Deckberater kennt die Themen „Energy“, „Sagas“, „Snow“ und „Group hug“. Sie erscheinen in der Suche, und Decks wie Satya, Tom Bombadil, Isu oder Kwain werden danach erkannt.
en: The deck advisor knows the Energy, Sagas, Snow and Group hug themes. They appear in search, and decks like Satya, Tom Bombadil, Isu or Kwain are read by them.
