kind: new
de: Wird ein Ergebnis angefochten, bekommen die anderen Spieler am Tisch und die Organisatoren eine Benachrichtigung. Erreichst du den Top Cut, erfährst du es ebenfalls per Benachrichtigung.
en: When a result is disputed, the other players at the table and the organizers get a notification. You also get one when you reach the top cut.
