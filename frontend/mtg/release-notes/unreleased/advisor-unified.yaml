kind: improved
de: Der Deck-Berater zeigt Hinzufügen, Kürzen und Tauschen jetzt auf einer Seite, mit Pfeilen für das, was jede Karte am Deck verbessert. Nach ein paar Partien fragt er, was schiefging, und stimmt die Ziele darauf ab.
en: The deck advisor now shows adding, cutting and swapping on one page, with arrows for what each card improves. After a few games it asks what went wrong and tunes its goals to match.
