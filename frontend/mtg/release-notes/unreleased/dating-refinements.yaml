kind: improved
de: "Command Zone Dating zeigt jeden Commander ab 40 Decks, auch aus neuen Sets. Doppelseitige Karten lassen sich umdrehen, Themes beim Date swipen, und die Seite passt besser auf Handys und breite Bildschirme."
en: "Command Zone Dating shows every Commander with 40 decks or more, new sets included. Double-faced cards flip, date themes swipe, and the pages fit phones and wide screens better."
