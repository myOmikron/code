kind: new
de: Sobald eine Runde startet, bekommst du eine Benachrichtigung mit deinem Tisch und Sitz. Melde dafür in den Einstellungen jedes Gerät an; Turnier-Benachrichtigungen lassen sich dort auch abschalten.
en: As soon as a round starts, you get a notification with your table and seat. Sign up each device for it in the settings, where you can also turn tournament notifications off.
