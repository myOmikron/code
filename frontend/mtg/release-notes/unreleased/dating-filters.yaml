kind: new
de: Beim Command Zone Dating swipst du auf Wunsch nur Commander aus bestimmten Sets oder in bestimmten Farben. Ein Tipp auf ein Manasymbol schließt die Farbe aus, ein zweiter macht sie zur Pflicht. Auf der Deck-Übersicht geht es direkt zum Dating.
en: In Command Zone Dating, swipe only Commanders from chosen sets or in chosen colors. Tap a mana symbol once to exclude the color, twice to require it. The deck overview now links straight to dating.
