kind: improved
de: Du kannst von jeder Seite zu deinen laufenden Turnieren zurückkehren und bei mehreren gezielt eines auswählen. Turnierlisten kennzeichnen jetzt auch deine Teilnahme, wenn du zugleich organisierst.
en: Return to your ongoing Tournaments from any page and choose which to open when several are running. Tournament lists now show your participation even when you also organize.
