kind: new
de: Der Lebenszähler bewahrt euren Spielverlauf mit Korrekturen, Kommandeursschaden und Spielausgängen lokal auf. Nach dem Neuladen könnt ihr weiterspielen und weitere Spiele beginnen, ohne frühere Spiele zu verlieren.
en: The life counter saves your history locally, including corrections, commander damage and Game outcomes. Resume after reloading and start further Games without losing earlier ones.
