de: Deine Turnierteilnahme und dein registriertes Deck sind direkt in der Übersicht sichtbar. Dort findest du auch dein Match, gemeldete Ergebnisse und die Aktionen zum Melden oder Anfechten.
en: Your Tournament participation and Registered deck are visible directly in the overview. Find your Match, recorded Results and actions to report or dispute them there too.
