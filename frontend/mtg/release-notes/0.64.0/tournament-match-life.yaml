kind: new
de: Öffne den Lebenszähler direkt für deinen Turniertisch, mit Namen, passenden Startwerten und Rundentimer. Beendete Spiele schlagen ein Ergebnis vor, das du selbst prüfst und meldest.
en: Open the life counter for your Tournament table with names, suggested starting totals and the Round timer. Completed Games suggest a Result for you to review and submit yourself.
