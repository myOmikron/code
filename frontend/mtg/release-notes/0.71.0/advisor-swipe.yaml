kind: new
de: Im Deck-Berater kannst du Vorschläge jetzt swipen. Rechts kommt die Karte ins Deck, links schlägt der Berater sie nie wieder vor. Am Computer geht das auch mit den Pfeiltasten.
en: You can now swipe through the deck advisor's suggestions. Right adds the card, left means the advisor never suggests it again. On a computer, the arrow keys do the same.
