kind: new
de: Der Deckberater kennt das Thema Kreaturentyp-Vielfalt. Decks, die verschiedene Kreaturentypen zählen wie mit Federation, bekommen Kreaturen mit mehreren Typen vorgeschlagen und gelten nicht mehr als Typal-Deck.
en: The deck advisor knows a creature type diversity theme. Decks that count different creature types, like Federation, are offered creatures with several types and are no longer read as Typal.
