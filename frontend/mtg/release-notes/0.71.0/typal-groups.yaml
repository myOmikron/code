kind: new
de: Karten für Sea Monsters oder Outlaws zählen im Deckberater für jeden ihrer Typen, Kraken bis Whale und Assassin bis Warlock, und bekommen Kreaturen dieser Typen vorgeschlagen.
en: Cards for Sea Monsters or outlaws count every type in the group in the deck advisor, Krakens to Whales and Assassins to Warlocks, and are offered creatures of those types.
