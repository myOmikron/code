kind: improved
de: Beschaffen ist in die Kartenliste gezogen, wo der Schalter Physisch (B) an jeder Karte zeigt, was im Physischen Deck liegt, ihr Kartenmenü sie besorgt und X Proxies hineinlegt oder wieder herausnimmt. Alles, was das ganze Deck betrifft, öffnest du über die Abweichung im Deckkopf.
en: Sourcing moved into the card list, where the Physical switch (B) shows on every card what lies in the Physical deck, its card menu sources it, and X puts Proxies in or takes them out again. Everything about the whole deck opens from the Deviation in the deck header.
