kind: improved
de: "Teilen ist jetzt ein einziges Fenster: Personen per Namenssuche mit Rolle hinzufügen, Rollen ändern, Entfernen rückgängig machen und im selben Fenster festlegen, wer Deck oder Sammlung sehen darf."
en: "Sharing is now one window: find people by name and add them with a role, change roles, undo a removal, and choose in the same place who can see a deck or collection."
