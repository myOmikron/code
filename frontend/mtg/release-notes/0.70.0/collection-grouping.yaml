kind: new
de: Sammlungen lassen sich wie Decks nach Typ, Manabetrag, Farbe, Set oder Tag gruppieren und als Raster, Stapel, Liste oder Tabelle in sieben Kartengrößen zeigen. Die Ansicht bleibt für den nächsten Besuch gespeichert.
en: Collections can be grouped by type, mana value, colour, set or tag like decks, and shown as grid, stacks, list or table in seven card sizes. The view is remembered for your next visit.
