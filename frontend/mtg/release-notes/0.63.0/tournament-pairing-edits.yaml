kind: new
de: Organisatoren können die Auslosung einer Runde vor dem Start von Hand ändern, Spieler tauschen, Tische umstellen und das Bye vergeben. Eine zu früh beendete Runde lässt sich zurücknehmen, solange die nächste noch nicht läuft.
en: Organizers can change a round's pairings by hand before it starts, swapping players, reordering tables and handing out the bye. A round ended too early can be taken back as long as the next one isn't running.
