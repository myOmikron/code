kind: new
de: Turniere an Tischen für drei bis fünf Spieler lassen sich nach TopDeck-Regeln spielen. Die Auslosung setzt niemanden zweimal an einen kleineren Tisch, solange es sich vermeiden lässt, meidet dann wiederholte Gegner, wechselt ab, wer anfängt, und die Tabelle entscheidet Gleichstände nach der Siegquote der Gegner.
en: Tournaments at tables for three to five players can be played under TopDeck rules. Pairings seat nobody at a smaller table twice while it can be avoided, then avoid repeat opponents, rotate who goes first, and the standings break ties by the opponents' win rate.
