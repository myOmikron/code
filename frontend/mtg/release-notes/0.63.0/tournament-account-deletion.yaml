kind: new
de: Turniere überstehen gelöschte Konten. Löschst du dein Konto, bleibst du als Gast in der Spielerliste, in Turnieren anderer anonym als „Gelöschter Spieler“, sofern du das nicht abwählst, und deine Turniere übernimmt ein Mitorganisator.
en: Tournaments survive deleted accounts. If you delete your account, you stay on the player list as a guest, anonymously as "Gelöschter Spieler" in other people's tournaments unless you untick that, and a co-organizer takes over your tournaments.
