kind: new
de: Eins-gegen-eins-Turniere können mit einem Top 4 oder Top 8 enden, gesetzt nach der Tabelle und mit eigenem Spielmodus. Ein eigener Reiter zeigt den Turnierbaum.
en: One-on-one tournaments can end with a top 4 or top 8, seeded by the standings and with their own match length. A tab of its own shows the bracket.
