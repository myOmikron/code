kind: new
de: Turniere an Tischen für drei bis fünf Spieler lassen sich nach dem Multiplayer Addendum spielen. Statt Byes gibt es kleinere Tische, an denen niemand zweimal sitzen muss, solange es sich vermeiden lässt, und die Tabelle entscheidet Gleichstände nach dem eigenen Anteil gewonnener Matches und den Punkten der Gegner.
en: Tournaments at tables for three to five players can be played under the Multiplayer Addendum. Instead of byes there are smaller tables, nobody sits at one twice while it can be avoided, and the standings break ties by the own share of matches won and the opponents' points.
