kind: new
de: Während einer Runde zeigt die Turnierseite dein Match mit Tisch, Sitz und Gegnern. Turniere können eine Rundenzeit haben, deren Timer mit der Runde startet und bei Zeitablauf die Zusatzzüge nennt.
en: During a round the tournament page shows your match with table, seat and opponents. Tournaments can have a round timer that starts with the round and names the extra turns when time is up.
