kind: new
de: Wird ein Ergebnis angefochten, bekommen die anderen Spieler am Tisch und die Organisatoren eine Benachrichtigung, und sobald ein Organisator es festlegt, erfahren es die Spieler am Tisch. Erreichst du den Top Cut, erfährst du es ebenfalls per Benachrichtigung.
en: When a result is disputed, the other players at the table and the organizers get a notification, and once an organizer settles it, the players at the table hear of it. You also get one when you reach the top cut.
