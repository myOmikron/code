kind: new
de: Spieler melden das Ergebnis ihres Matches jetzt selbst, und es zählt sofort. Stimmt es nicht, fechten die anderen am Tisch es an, bis die Runde endet, und ein Organisator entscheidet.
en: Players now report their own match result, and it counts at once. If it is wrong, the others at the table dispute it until the round ends, and an organizer decides.
