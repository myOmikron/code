# SPA routing: unknown paths fall back to index.html — TanStack Router uses
# browser history, so a deep link must serve the app shell, not a 404.
#
# Caching: vite content-hashes everything under /assets/, so those may be
# cached forever. Everything else (index.html, the service worker, manifest,
# unhashed public/ files) is revalidated on every request — otherwise a stale
# index.html keeps referencing assets a new deploy has replaced.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
