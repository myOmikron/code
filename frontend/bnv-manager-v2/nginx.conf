# SPA routing: unknown paths fall back to index.html — TanStack Router uses
# browser history, so a deep link (e.g. an invite or credential-reset link)
# must serve the app shell, not a 404.
#
# Caching: vite content-hashes everything under /assets/, so those may be
# cached forever. Everything else (index.html, the manifest, the translations
# under /locales/ that i18next fetches at runtime, unhashed public/ files) is
# revalidated on every request — otherwise a stale index.html keeps
# referencing assets a new deploy has replaced.
#
# No service worker here: this app has no PWA plugin, so there is no /sw.js to
# keep out of the caches.
#
# OIDC discovery: the provider's document lives below the issuer, at
# /api/v1/auth/.well-known/openid-configuration. Relying parties that look for
# it at the origin's root would otherwise get index.html from the SPA fallback,
# so that one path is proxied to the webserver. The document is unchanged, its
# issuer stays /api/v1/auth.
server {
    listen 80;

    # Nothing gains from knowing which nginx this is; a version number is only
    # useful to someone matching it against a vulnerability list.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /.well-known/openid-configuration {
        # Resolved at request time via Docker's embedded DNS: with the upstream in a
        # variable nginx starts even while the webserver is not up yet.
        resolver 127.0.0.11 valid=30s;
        set $webserver http://webserver:8080;
        proxy_pass $webserver/api/v1/auth/.well-known/openid-configuration;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
