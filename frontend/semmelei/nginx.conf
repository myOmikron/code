# SPA routing: unknown paths fall back to index.html — TanStack Router uses
# browser history, so a deep link (e.g. the registration link) must serve the
# app shell, not a 404.
#
# Caching: vite content-hashes everything under /assets/, so those may be
# cached forever. Everything else (index.html, the service worker, manifest,
# translations, unhashed public/ files) is revalidated on every request —
# otherwise a stale index.html keeps referencing assets a new deploy has
# replaced.
server {
    listen 80;

    # Nothing gains from knowing which nginx this is; a version number is only
    # useful to someone matching it against a vulnerability list.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The worker decides when everything else is replaced, so it is the one file
    # that must never come from a cache — not the browser's, not a proxy's.
    # "no-cache" would still allow a stored copy to be handed out on a
    # revalidation the browser is free to skip.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
