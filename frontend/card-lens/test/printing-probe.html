<!doctype html>
<html lang="de">
  <head><meta charset="UTF-8" /><title>Printing selection probe</title></head>
  <body data-status="running">
    <pre id="result">läuft …</pre>
    <script type="module">
      // Isolates the PRINTING decision from the identity decision: hands `findMatchesByTitle` the
      // card's real name — as a perfect OCR read would — and asks which printing it picks. That
      // works for every labelled photo, including the ones whose title OCR fails, so the choice
      // among same-name printings can be measured on its own.
      import { findMatchesByTitle } from "../src/allCardIndex.ts";
      import { createScanSignatures, detectCardBounds } from "../src/imageHash.ts";

      const CARD_ASPECT = 63 / 88;
      const OUT_H = 880;
      const norm = (v) => String(v).trim().toUpperCase().replace(/^0+(?=\d)/, "");

      async function decode(url) {
        const blob = await (await fetch(url)).blob();
        return createImageBitmap(blob, { imageOrientation: "from-image" });
      }
      async function guideCrop(bitmap) {
        const b = detectCardBounds(bitmap) ?? { x: 0, y: 0, width: bitmap.width, height: bitmap.height };
        const outW = Math.round(OUT_H * CARD_ASPECT);
        const c = document.createElement("canvas");
        c.width = outW; c.height = OUT_H;
        c.getContext("2d").drawImage(bitmap, b.x, b.y, b.width, b.height, 0, 0, outW, OUT_H);
        return createImageBitmap(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.9)));
      }

      try {
        const labels = await (await fetch("./dataset/labels.json")).json();
        const rows = [];
        for (const label of labels) {
          const signatures = createScanSignatures(await guideCrop(await decode(`./dataset/images/${label.file}`)));
          const result = await findMatchesByTitle(label.name, signatures, 5);
          const ranked = result.matches.map((m) => `${norm(m.card.setCode)}#${norm(m.card.collectorNumber)} ${m.similarity.toFixed(3)}`);
          const wanted = `${norm(label.set)}#${norm(label.number)}`;
          const rank = result.matches.findIndex((m) => `${norm(m.card.setCode)}#${norm(m.card.collectorNumber)}` === wanted);
          rows.push({
            file: label.file,
            want: wanted,
            got: ranked[0] ?? "-",
            correct: rank === 0,
            rankOfCorrect: rank < 0 ? null : rank + 1,
            top: ranked,
          });
        }
        const correct = rows.filter((r) => r.correct).length;
        const inTop3 = rows.filter((r) => r.rankOfCorrect !== null && r.rankOfCorrect <= 3).length;
        document.body.dataset.status = "passed";
        document.querySelector("#result").textContent = JSON.stringify({
          printingCorrect: `${correct}/${rows.length}`,
          correctInTop3: `${inTop3}/${rows.length}`,
          rows,
        }, null, 1);
      } catch (error) {
        document.body.dataset.status = "failed";
        document.querySelector("#result").textContent = String(error?.stack || error);
      }
    </script>
  </body>
</html>
