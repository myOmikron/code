<!doctype html>
<html lang="de">
  <head><meta charset="UTF-8" /><title>Perceptual Recall@N</title></head>
  <body data-status="running">
    <pre id="result">läuft …</pre>
    <script type="module">
      // How deep in the perceptual ranking does the correct card sit? This bounds every idea that
      // tries to RESCUE a card whose title OCR failed by verifying perceptual's candidates against
      // some other signal (rules text, type line, …): such a verifier can only ever recover cards
      // the perceptual matcher already surfaced. If the right card is not in the top N at all,
      // no amount of verification helps and the answer has to come from reading the card better.
      import { findAllCardMatches } from "../src/allCardIndex.ts";
      import { createScanSignatures, detectCardBounds } from "../src/imageHash.ts";

      const CARD_ASPECT = 63 / 88;
      const OUT_H = 880;
      const DEPTH = Number(new URLSearchParams(location.search).get("depth") ?? 25);
      const fold = (v) => String(v).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

      async function decode(url) {
        const blob = await (await fetch(url)).blob();
        return createImageBitmap(blob, { imageOrientation: "from-image" });
      }
      async function guideCrop(bitmap) {
        const b = detectCardBounds(bitmap) ?? { x: 0, y: 0, width: bitmap.width, height: bitmap.height };
        const outW = Math.round(OUT_H * CARD_ASPECT);
        const c = document.createElement("canvas");
        c.width = outW; c.height = OUT_H;
        c.getContext("2d").drawImage(bitmap, b.x, b.y, b.width, b.height, 0, 0, outW, OUT_H);
        return createImageBitmap(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.9)));
      }

      try {
        const labels = await (await fetch("./dataset/labels.json")).json();
        const rows = [];
        for (const label of labels) {
          const crop = await guideCrop(await decode(`./dataset/images/${label.file}`));
          const signatures = createScanSignatures(crop);
          const matches = await findAllCardMatches(signatures.identification, DEPTH, undefined, signatures.printing);
          const names = matches.map((m) => fold(m.card.name));
          const rank = names.indexOf(fold(label.name));
          rows.push({
            file: label.file,
            expected: label.name,
            nameRank: rank < 0 ? null : rank + 1, // 1-based; null = not in top DEPTH
            top3: matches.slice(0, 3).map((m) => m.card.name).join(" | "),
          });
        }
        const inTop = (n) => rows.filter((r) => r.nameRank !== null && r.nameRank <= n).length;
        document.body.dataset.status = "passed";
        document.querySelector("#result").textContent = JSON.stringify({
          depth: DEPTH,
          total: rows.length,
          recallAt1: inTop(1), recallAt3: inTop(3), recallAt10: inTop(10), recallAtDepth: inTop(DEPTH),
          rows,
        }, null, 1);
      } catch (error) {
        document.body.dataset.status = "failed";
        document.querySelector("#result").textContent = String(error?.stack || error);
      }
    </script>
  </body>
</html>
