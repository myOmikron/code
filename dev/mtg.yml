# Dev stack for mtg: just dev mtg up -d --build
# Single entrypoint is traefik — it routes /api and /docs to the webserver,
# /swagger-ui to the OpenAPI explorer and everything else to the vite dev
# server. Reachable two ways:
#   http://localhost      — as before
#   https://${DOMAIN}     — over the tailnet, for testing on a real phone
# The tailnet side needs TS_AUTHKEY in dev/common/env.secret (see the example).
# Shared infra (NATS) lives in dev/infra.yml and must be started separately.
name: mtg

services:
  traefik:
    image: traefik:3
    # Shares the tailscale container's network namespace, so it answers on the
    # tailnet address and can reach the internal CA. Ports are published by
    # that container — a namespace has one owner.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    env_file: [ common/env.common ]
    # lego (traefik's ACME client) does not use the system trust store, so the
    # internal root has to be handed to it explicitly.
    environment:
      - LEGO_CA_CERTIFICATES=/root_ca.crt
    volumes:
      - vol-acme:/acme
      - ./common/root_ca.crt:/root_ca.crt:ro
      - ./mtg/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./mtg/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  # Joins the tailnet and owns the network namespace traefik runs in.
  tailscale:
    # renovate: datasource=docker depName=tailscale/tailscale
    image: tailscale/tailscale:v1.102.2
    cap_add:
      - NET_ADMIN
    environment:
      # Kernel networking rather than userspace: traefik shares this namespace
      # and has to see the tailnet as an ordinary interface.
      - TS_USERSPACE=false
    volumes:
      - /dev/net/tun:/dev/net/tun
      - vol-tailscale:/var/lib/tailscale
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: [ "CMD", "tailscale", "status", "--peers=false" ]
      interval: 3s
      timeout: 5s
      retries: 20
    env_file:
      - common/env.common
      - path: common/env.secret
        required: false
    # Tailnet DNS is off (see TS_ACCEPT_DNS), so the CA would be looked up
    # publicly, where the name lands on an unrelated web host. Pinned to its
    # tailnet address instead.
    extra_hosts:
      - "ca.int.omikron.dev:100.64.0.3"

  frontend:
    build:
      context: ..
      dockerfile: dev/common/frontend-dev.Dockerfile
    # Same uid as the developer on the host, so everything the container writes
    # into the bind-mounted workspace stays theirs (see the Dockerfile).
    user: "1000:1000"
    environment:
      - FRONTEND=mtg
      # vite's own /api proxy target — only relevant when bypassing traefik
      - API_PROXY_TARGET=http://webserver:8080
      # used by `just gen-api mtg` (runs inside this container)
      - WEBSERVER_URL=http://webserver:8080
    volumes:
      - ../:/app

  # OpenAPI explorer for the webserver's spec, on http://localhost/swagger-ui.
  # The spec urls are same-origin paths, so the browser fetches them back
  # through traefik — no CORS, and no second host to configure.
  swagger:
    # renovate: datasource=docker depName=swaggerapi/swagger-ui
    image: swaggerapi/swagger-ui:v5.32.8
    environment:
      - BASE_URL=/swagger-ui
      - 'URLS=[{ url: "/docs/frontend.json", name: "Frontend" }, { url: "/docs/openapi.json", name: "All routes" }]'

  webserver:
    env_file: [ common/env.common ]
    environment:
      - POSTGRES_HOST=postgres
      - LISTEN_ADDRESS=0.0.0.0
      - LISTEN_PORT=8080
    # net-dev connects it to NATS from dev/infra.yml (mail-gateway hand-off)
    networks: [ default, net-dev ]
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ..
      dockerfile: services/mtg/Dockerfile
    # Exposed for host-side smoke tests without going through traefik
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    env_file: [ common/env.common ]
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vol-db:/var/lib/postgresql

volumes:
  vol-db:
  vol-tailscale:
  vol-acme:

networks:
  net-dev:
    name: dev
    external: true