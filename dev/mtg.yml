name: mtg

services:
  traefik:
    image: traefik:3
    ports:
      - "80:80"
    volumes:
      - ./mtg/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./mtg/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  frontend:
    build:
      context: ..
      dockerfile: dev/common/frontend-dev.Dockerfile
    environment:
      - FRONTEND=mtg
    volumes:
      - ../:/app

  webserver:
    env_file: [ common/env.common ]
    environment:
      - POSTGRES_HOST=postgres
      - LISTEN_ADDRESS=0.0.0.0
      - LISTEN_PORT=8080
    # net-dev connects it to NATS from dev/infra.yml (mail-gateway hand-off)
    networks: [ default, net-dev ]
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ..
      dockerfile: services/mtg/Dockerfile
    # Exposed for host-side smoke tests without going through traefik
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    env_file: [ common/env.common ]
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vol-db:/var/lib/postgresql

volumes:
  vol-db:

networks:
  net-dev:
    name: dev
    external: true