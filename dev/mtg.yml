# Dev stack for mtg: just dev mtg up -d --build
# Single entrypoint is traefik — it routes /api and /docs to the webserver,
# /swagger-ui to the OpenAPI explorer and everything else to the vite dev
# server. Reachable two ways:
#   http://localhost      — as before
#   https://${DOMAIN}     — over the tailnet, for testing on a real phone
# The tailnet side needs TS_AUTHKEY in dev/common/env.secret (see the example).
# Shared infra (NATS, the mail gateway and its mailbox on http://localhost:8025)
# lives in dev/infra.yml and must be started separately.
name: mtg

services:
  traefik:
    image: traefik:3
    # Shares the tailscale container's network namespace, so it answers on the
    # tailnet address and can reach the internal CA. Ports are published by
    # that container — a namespace has one owner.
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    env_file: [ common/env.common ]
    # lego (traefik's ACME client) does not use the system trust store, so the
    # internal root has to be handed to it explicitly.
    environment:
      - LEGO_CA_CERTIFICATES=/root_ca.crt
    volumes:
      - vol-acme:/acme
      - ./common/root_ca.crt:/root_ca.crt:ro
      - ./mtg/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./mtg/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  # Joins the tailnet and owns the network namespace traefik runs in.
  tailscale:
    # renovate: datasource=docker depName=tailscale/tailscale
    image: tailscale/tailscale:v1.102.2
    cap_add:
      - NET_ADMIN
    environment:
      # Kernel networking rather than userspace: traefik shares this namespace
      # and has to see the tailnet as an ordinary interface.
      - TS_USERSPACE=false
    volumes:
      - /dev/net/tun:/dev/net/tun
      - vol-tailscale:/var/lib/tailscale
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: [ "CMD", "tailscale", "status", "--peers=false" ]
      interval: 3s
      timeout: 5s
      retries: 20
    env_file:
      - common/env.common
      - path: common/env.secret
        required: false
    # Tailnet DNS is off (see TS_ACCEPT_DNS), so the CA would be looked up
    # publicly, where the name lands on an unrelated web host. Pinned to its
    # tailnet address instead.
    extra_hosts:
      - "ca.int.omikron.dev:100.64.0.3"

  frontend:
    build:
      context: ..
      dockerfile: dev/common/frontend-dev.Dockerfile
    # Same uid as the developer on the host, so everything the container writes
    # into the bind-mounted workspace stays theirs (see the Dockerfile).
    user: "1000:1000"
    environment:
      - FRONTEND=mtg
      # vite's own /api proxy target — only relevant when bypassing traefik.
      # Also carries /api/graph: the webserver proxies the advisor.
      - API_PROXY_TARGET=http://webserver:8080
      # used by `just gen-api mtg` (runs inside this container)
      - WEBSERVER_URL=http://webserver:8080
      # used by `just gen-graph-api` (runs inside this container)
      - GRAPH_URL=http://graph:8000
    volumes:
      - ../:/app

  # OpenAPI explorer for the webserver's spec, on http://localhost/swagger-ui.
  # The spec urls are same-origin paths, so the browser fetches them back
  # through traefik — no CORS, and no second host to configure.
  swagger:
    # renovate: datasource=docker depName=swaggerapi/swagger-ui
    image: swaggerapi/swagger-ui:v5.32.8
    environment:
      - BASE_URL=/swagger-ui
      - 'URLS=[{ url: "/docs/frontend.json", name: "Frontend" }, { url: "/docs/openapi.json", name: "All routes" }]'

  webserver:
    env_file: [ common/env.common ]
    environment:
      - POSTGRES_HOST=postgres
      - LISTEN_ADDRESS=0.0.0.0
      - LISTEN_PORT=8080
      # Upstream of the authenticated /api/graph proxy
      - GRAPH_URL=http://graph:8000
    # net-dev connects it to NATS from dev/infra.yml (mail-gateway hand-off)
    networks: [ default, net-dev ]
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ..
      dockerfile: services/mtg/Dockerfile
    # Exposed for host-side smoke tests without going through traefik.
    # Loopback only: the host sits on a tailnet.
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:18
    env_file: [ common/env.common ]
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vol-db:/var/lib/postgresql

  # Graph-backed deck advisor (FastAPI + Neo4j). Not routed by traefik — the
  # webserver proxies /api/graph to it behind its auth layer. Port 8000 is
  # exposed for host-side smoke tests, loopback only: the host sits on a
  # tailnet.
  #
  # The container ingests the corpus on first start (cards, tags, semantics,
  # combos — a few minutes, mostly downloads) and skips whatever the graph
  # already holds on every start after. `just graph logs -f` follows it; the
  # advisor answers 0 for every role until the semantics step lands. Set
  # BOOTSTRAP_ON_START=false to load it by hand instead — see
  # services/mtg-graph/README.md.
  graph:
    build:
      context: ..
      dockerfile: dev/common/graph-dev.Dockerfile
    # Same uid as the developer on the host, so everything the container writes
    # into the bind-mounted workspace stays theirs (see the Dockerfile).
    user: "1000:1000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-deck-lab-dev}
      # false = start the API immediately and load the corpus by hand
      # (`just graph bootstrap`).
      - BOOTSTRAP_ON_START=${BOOTSTRAP_ON_START:-true}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - ../:/app
      - vol-graph-venv:/venv
      - vol-graph-uv:/uv-cache
      - vol-graph-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  neo4j:
    # Calendar-versioned releases superseded the 5.x line. Pinned to a minor so
    # a store-format change never arrives unannounced; the corpus re-ingests in
    # ~8s, so upgrading is a `down -v` away rather than a store migration.
    # renovate: datasource=docker depName=neo4j
    image: neo4j:2026.06-community
    environment:
      # Only NEO4J_AUTH here: the entrypoint parses every other NEO4J_* var as
      # a config setting and hard-fails on unknown names.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-deck-lab-dev}
      # The semantic build writes tens of thousands of edges per batch.
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_db_transaction_timeout=300s
    # Published for the Neo4j browser (7474) and host-side cypher-shell (7687).
    # Loopback only: the host sits on a tailnet, and this instance carries a
    # fixed dev password.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      # cypher-shell exits non-zero until the DB is actually accepting queries;
      # the graph service then only starts once ingestion could safely run.
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - vol-neo4j-data:/data
      - vol-neo4j-logs:/logs

volumes:
  vol-db:
  vol-tailscale:
  vol-acme:
  vol-graph-venv:
  vol-graph-uv:
  vol-graph-data:
  vol-neo4j-data:
  vol-neo4j-logs:

networks:
  net-dev:
    name: dev
    external: true
