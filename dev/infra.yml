# Shared dev infrastructure, used by all per-service stacks via the external
# `dev` network. Start once: just dev infra up -d --build
#
# NATS, the mail gateway that listens on it, and the mailbox everything it
# sends ends up in — http://localhost:8025. A service stack needs this running
# before a signup can hand over its registration mail.
name: infra

services:
  nats:
    image: nats:2.15.1
    command: "--jetstream"
    networks: [ net-dev ]

  # Delivers what the services publish on `mail.>` — without it a signup is a
  # registration link nobody ever receives.
  #
  # Here rather than in a service stack because it owns the MAIL stream and the
  # one consumer on it, and every dev stack shares this NATS: a second gateway
  # would take turns swallowing the first one's mail.
  mail-gateway:
    build:
      context: ..
      dockerfile: services/mail-gateway/Dockerfile
    env_file: [ common/env.common ]
    environment:
      # Everything goes to mailpit below, so no dev mail can reach a real
      # address. Plaintext on 1025 is what mailpit listens for.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SECURITY=none
      - MAIL_FROM=dev@omikron.dev
    networks: [ net-dev ]
    depends_on: [ nats ]

  # The inbox every dev mail lands in: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30.7
    networks: [ net-dev ]
    ports:
      - "8025:8025"

  test-postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_PASSWORD=postgres
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [ net-dev ]
    ports:
      - "127.0.0.1:5432:5432"

networks:
  net-dev:
    name: dev
