# Drift check: gen-api must reproduce the committed specs and clients. PRs
# regenerate the frontends tools/gen-api/changed-frontends.py selects, main all.
name: gen-api

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gen-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.99.1"

      - name: Determine frontends
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FRONTENDS=$(python3 tools/gen-api/changed-frontends.py "origin/${BASE_REF}")
          else
            FRONTENDS=$(find frontend -mindepth 2 -maxdepth 2 -name api-clients.json | cut -d/ -f2 | sort)
          fi
          FRONTENDS=$(echo "$FRONTENDS" | paste -sd ' ')
          if [ -z "$FRONTENDS" ]; then
            echo "Nothing gen-api relevant changed, generation will be skipped."
          else
            echo "Frontends: $FRONTENDS"
          fi
          echo "frontends=$FRONTENDS" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.scope.outputs.frontends != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev mold

      - name: Cache cargo registry, git deps and target dir
        if: steps.scope.outputs.frontends != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gen-api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        if: steps.scope.outputs.frontends != ''
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv versioning=semver
          version: "0.13.1"

      - name: Install pnpm
        if: steps.scope.outputs.frontends != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node
        if: steps.scope.outputs.frontends != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install node_modules
        if: steps.scope.outputs.frontends != ''
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        if: steps.scope.outputs.frontends != ''
        env:
          FRONTENDS: ${{ steps.scope.outputs.frontends }}
        run: |
          set -euo pipefail
          for frontend in $FRONTENDS; do
            python3 tools/gen-api/gen-api.py "$frontend"
          done

      - name: Fail on drift
        if: steps.scope.outputs.frontends != ''
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed API specs or clients differ from gen-api's output. Run \`just gen-api <frontend>\` and commit the result."
            git status --short
            git diff
            exit 1
          fi
