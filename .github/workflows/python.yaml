name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/python.yaml"
      - "services/mtg-graph/**"
  pull_request:
    paths:
      - ".github/workflows/python.yaml"
      - "services/mtg-graph/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    container:
      # Same image the dev stack and the release build use.
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    services:
      neo4j:
        image: neo4j:2026.06-community   # keep in sync with dev/mtg.yml's pin
        env:
          NEO4J_AUTH: neo4j/deck-lab-dev
    env:
      NEO4J_TEST_URI: bolt://neo4j:7687
      NEO4J_TEST_PASSWORD: deck-lab-dev
    defaults:
      run:
        working-directory: services/mtg-graph
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest
