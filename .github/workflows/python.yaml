name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/python.yaml"
      - "services/mtg-graph/**"
      # The graph mirrors this module's regexes (test_bracket_breakers.py
      # holds the two in lockstep), so a Rust-side edit must run this suite.
      - "services/mtg/src/utils/bracket_flags.rs"
  pull_request:
    paths:
      - ".github/workflows/python.yaml"
      - "services/mtg-graph/**"
      - "services/mtg/src/utils/bracket_flags.rs"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    container:
      # Same image the dev stack and the release build use.
      image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim@sha256:d8e732839dfc4225a1ff698803b478b2223c05636c055d3add41ab9dbec0f315
    services:
      neo4j:
        image: neo4j:2026.06-community   # keep in sync with dev/mtg.yml's pin
        env:
          NEO4J_AUTH: neo4j/deck-lab-dev
    env:
      NEO4J_TEST_URI: bolt://neo4j:7687
      NEO4J_TEST_PASSWORD: deck-lab-dev
    defaults:
      run:
        working-directory: services/mtg-graph
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest
