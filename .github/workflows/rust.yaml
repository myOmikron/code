name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - ".github/workflows/rust.yaml"
      - ".github/actions/rust-ci/**"
      - "**/*.rs"
      - "**/*.proto"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "*.toml"
      - ".*.toml"
      - "proto/**"
      - "sgconfig.yml"
      - ".ast-grep/**"
      - "tools/ci-image/**"
      - "tools/changed-crates.py"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      # Full history so the changed-crates script can resolve the PR merge-base.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-ci