name: i18n

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/*/public/locales/**"
      - "frontend/*/src/**"
      - "tools/check-i18n.py"
      - ".github/workflows/i18n.yaml"
  pull_request:
    paths:
      - "frontend/*/public/locales/**"
      - "frontend/*/src/**"
      - "tools/check-i18n.py"
      - ".github/workflows/i18n.yaml"

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check keys and namespaces
        run: python3 tools/check-i18n.py
