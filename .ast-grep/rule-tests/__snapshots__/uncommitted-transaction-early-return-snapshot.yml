id: uncommitted-transaction-early-return
snapshots:
  ? |
    async fn conditional_return(db: &Database, absent: bool) -> Result<u8, TransactionError> {
        let mut tx = db.start_transaction().await?;
        if absent {
            return if absent {
                Err(TransactionError::Hook("absent".into()))
            } else {
                Ok(1)
            };
        }
        tx.commit().await?;
        Ok(0)
    }
