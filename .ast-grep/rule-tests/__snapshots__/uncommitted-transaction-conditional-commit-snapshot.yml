    async fn one_arm_commits(db: &Database, which: u8) -> Result<(), TransactionError> {
        let mut tx = db.start_transaction().await?;
        match which {
            0 => tx.commit().await?,
            _ => borrow_tx(&mut tx).await?,
        }
        Ok(())
    }
