    async fn else_only(db: &Database, work: bool) -> Result<(), TransactionError> {
        let mut tx = db.start_transaction().await?;
        if work {
            borrow_tx(&mut tx).await?;
        } else {
            tx.commit().await?;
        }
        Ok(())
    }
