    async fn commit_in_loop(db: &Database, items: &[u8]) -> Result<(), TransactionError> {
        let mut tx = db.start_transaction().await?;
        for item in items {
            borrow_tx(&mut tx).await?;
            tx.commit().await?;
        }
        Ok(())
    }
