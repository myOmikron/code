        Ok(())
    }
  # a field that happens to be called `commit` is not a commit
  - |
    async fn field_named_commit(db: &Database, repo: &Repo) -> Result<String, TransactionError> {
        let mut tx = db.start_transaction().await?;
        borrow_tx(&mut tx).await?;
        let sha = repo.commit.clone();
        Ok(sha)
    }
