[package]
name = "galvyn-identity"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
authors = ["Niklas Pfister <git@omikron.dev>"]
publish = false

[features]
default = []
passkey = ["dep:webauthn-rs", "dep:webauthn-rs-proto", "dep:serde_cbor_2", "dep:openssl"]
oidc = ["dep:openidconnect", "dep:reqwest", "dep:tokio", "dep:base64", "dep:clap"]
test-support = ["dep:base64"]

[dependencies]
galvyn = { workspace = true }
tower-sessions = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

webauthn-rs = { workspace = true, optional = true }
webauthn-rs-proto = { workspace = true, optional = true }
serde_cbor_2 = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }

openidconnect = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
