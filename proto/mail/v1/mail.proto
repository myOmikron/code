syntax = "proto3";
package mail.v1;

// Request to send a single plain-text email, optionally with attachments.
//
// The producer renders the complete subject and body; the mail-gateway only
// transports them. The sender address is the gateway's own configuration.
// Metadata (correlation-id, source) goes in NATS headers, not in here.
message SendEmail {
  // Recipient address, optionally with a display name ("Erika Muster <erika@example.com>")
  string to = 1;

  // Subject line
  string subject = 2;

  // Plain-text body (UTF-8)
  string text_body = 3;

  // Additional recipients in the CC header, same format as `to`
  repeated string cc = 4;

  // Files attached to the mail; without any the mail is a single plain-text part
  repeated Attachment attachments = 5;
}

// A file attached to a `SendEmail`
message Attachment {
  // File name the receiver sees ("rechnung-2026-17.pdf")
  string filename = 1;

  // MIME type of `content` ("application/pdf")
  string content_type = 2;

  // Raw file content
  bytes content = 3;
}
