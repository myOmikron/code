name: mtg

services:
  traefik:
    image: traefik:3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # dynamic.yml resolves `{{ env "DOMAIN" }}` at load time
    environment:
      - DOMAIN=${DOMAIN:?}
    volumes:
      - vol-acme:/acme
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  frontend:
    image: ghcr.io/myomikron/mtg/nginx:${MTG_VERSION:?}
    restart: unless-stopped

  webserver:
    image: ghcr.io/myomikron/mtg/webserver:${MTG_VERSION:?}
    restart: unless-stopped
    environment:
      # WebAuthn rp_origin/rp_id — changing the host invalidates all passkeys!
      - PUBLIC_ORIGIN=https://${DOMAIN:?}
      - LISTEN_ADDRESS=0.0.0.0
      - LISTEN_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mtg
      - POSTGRES_USER=mtg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - NATS_URL=nats://nats:4222
      # An empty OTLP endpoint disables trace export.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://localhost}
      - GRAFANA_TRACING_URI=${GRAFANA_TRACING_URI:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  mail-gateway:
    image: ghcr.io/myomikron/mail-gateway/webserver:${MAIL_GATEWAY_VERSION:?}
    restart: unless-stopped
    environment:
      - NATS_URL=nats://nats:4222
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:?}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://localhost}
      - GRAFANA_TRACING_URI=${GRAFANA_TRACING_URI:-http://localhost}
    depends_on:
      nats:
        condition: service_started

  nats:
    image: nats:2
    restart: unless-stopped
    # JetStream state on disk: the MAIL stream is a durable work queue,
    # queued mails must survive a restart.
    command: "--jetstream --store_dir /data"
    volumes:
      - vol-nats:/data

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mtg
      - POSTGRES_USER=mtg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mtg" ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vol-db:/var/lib/postgresql

volumes:
  vol-db:
  vol-nats:
  vol-acme:
