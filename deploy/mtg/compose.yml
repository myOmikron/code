name: mtg

services:
  traefik:
    image: traefik:3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # dynamic.yml resolves `{{ env "DOMAIN" }}` at load time
    environment:
      - DOMAIN=${DOMAIN:?}
    volumes:
      - vol-acme:/acme
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  frontend:
    image: ghcr.io/myomikron/mtg/nginx:${MTG_VERSION:?}
    restart: unless-stopped

  webserver:
    image: ghcr.io/myomikron/mtg/webserver:${MTG_VERSION:?}
    restart: unless-stopped
    environment:
      # WebAuthn rp_origin/rp_id — changing the host invalidates all passkeys!
      - PUBLIC_ORIGIN=https://${DOMAIN:?}
      - LISTEN_ADDRESS=0.0.0.0
      - LISTEN_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mtg
      - POSTGRES_USER=mtg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - NATS_URL=nats://nats:4222
      # Upstream of the authenticated /api/graph proxy
      - GRAPH_URL=http://graph:8000
      # An empty OTLP endpoint disables trace export.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://localhost}
      - GRAFANA_TRACING_URI=${GRAFANA_TRACING_URI:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  # Pulls Scryfall's card catalog and, with the fresh prices, re-decides every
  # watch list alarm. Loops in-process rather than being scheduled from outside:
  # a compose stack has no cron, and the runtime image has no shell to put a
  # `while` loop in.
  #
  # Hourly, which sounds often and is not: Scryfall regenerates the bulk file at
  # most every twelve hours, and a tick that finds the same file downloads
  # nothing and costs one small request. That is what buys picking the new file
  # up within the hour instead of guessing when it lands.
  #
  # To read the catalog regardless of the stamp, once:
  #   docker compose run --rm catalog-sync sync-catalog --force
  #
  # Nothing schedules itself in the image without `--every-minutes`, so this is
  # a Kubernetes CronJob later with the same tag and args ["sync-catalog"].
  catalog-sync:
    image: ghcr.io/myomikron/mtg/webserver:${MTG_VERSION:?}
    restart: unless-stopped
    command: [ "sync-catalog", "--every-minutes", "60" ]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mtg
      - POSTGRES_USER=mtg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      # The config loader requires these of every invocation. This one listens
      # on nothing and proxies nothing, so they only have to parse.
      - PUBLIC_ORIGIN=https://${DOMAIN:?}
      - GRAPH_URL=http://graph:8000
      - LISTEN_ADDRESS=127.0.0.1
      - LISTEN_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

  mail-gateway:
    image: ghcr.io/myomikron/mail-gateway/webserver:${MAIL_GATEWAY_VERSION:?}
    restart: unless-stopped
    environment:
      - NATS_URL=nats://nats:4222
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:?}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://localhost}
      - GRAFANA_TRACING_URI=${GRAFANA_TRACING_URI:-http://localhost}
    depends_on:
      nats:
        condition: service_started

  # Graph-backed deck advisor. Not routed by traefik — the webserver proxies
  # /api/graph to it behind its auth layer.
  #
  # The container loads the corpus on first start and skips whatever the graph
  # already holds afterwards, so an empty Neo4j volume costs one slow boot
  # rather than an advisor that reports 0 for every role. Refreshing it against
  # newer Scryfall data is still manual, and is the same command:
  #   just prod mtg exec graph deck-lab bootstrap --force
  graph:
    image: ghcr.io/myomikron/mtg/graph:${MTG_VERSION:?}
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?}
      # Scryfall 400s requests with a generic User-Agent; contact info required.
      - SCRYFALL_USER_AGENT=${SCRYFALL_USER_AGENT:?}
      # false = serve immediately and load the corpus by hand
      # (`just prod mtg exec graph deck-lab bootstrap`).
      - BOOTSTRAP_ON_START=${BOOTSTRAP_ON_START:-true}
    volumes:
      - vol-graph-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # Uvicorn starts only after the bootstrap attempt. /health additionally
      # verifies that every corpus layer exists, so `compose up --wait` cannot
      # turn green for an empty or partially bootstrapped graph.
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 60

  neo4j:
    # Pinned to a minor so a store-format change never arrives unannounced;
    # the corpus re-ingests in seconds, so upgrading is wiping vol-neo4j-*
    # and re-running the ingest rather than a store migration.
    # renovate: datasource=docker depName=neo4j
    image: neo4j:2026.06-community
    restart: unless-stopped
    environment:
      # Only NEO4J_AUTH here: the entrypoint parses every other NEO4J_* var as
      # a config setting and hard-fails on unknown names.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?}
      # The semantic build writes tens of thousands of edges per batch.
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_db_transaction_timeout=300s
    healthcheck:
      # cypher-shell exits non-zero until the DB actually accepts queries.
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - vol-neo4j-data:/data
      - vol-neo4j-logs:/logs

  nats:
    image: nats:2
    restart: unless-stopped
    # JetStream state on disk: the MAIL stream is a durable work queue,
    # queued mails must survive a restart.
    command: "--jetstream --store_dir /data"
    volumes:
      - vol-nats:/data

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mtg
      - POSTGRES_USER=mtg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mtg" ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vol-db:/var/lib/postgresql

volumes:
  vol-db:
  vol-nats:
  vol-acme:
  vol-graph-data:
  vol-neo4j-data:
  vol-neo4j-logs:
