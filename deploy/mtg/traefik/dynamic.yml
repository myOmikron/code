# Routing: /api goes to the webserver (which itself proxies /api/graph to the
# internal graph advisor behind its auth layer), everything else to the static
# frontend. The /api rule outranks the catch-all by rule length.
# `/docs` (OpenAPI specs) and the swagger explorer are dev-only.

http:
  routers:
    webserver:
      rule: 'Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/api`)'
      entryPoints: [ websecure ]
      service: webserver
      tls:
        certResolver: letsencrypt
    frontend:
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      entryPoints: [ websecure ]
      service: frontend
      middlewares: [ scanner-isolation ]
      tls:
        certResolver: letsencrypt

  middlewares:
    scanner-isolation:
      headers:
        customResponseHeaders:
          # SharedArrayBuffer lets ONNX use multiple WASM threads. credentialless
          # keeps public cross-origin artwork usable without requiring CORP.
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "credentialless"

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
    webserver:
      loadBalancer:
        servers:
          - url: "http://webserver:8080"
