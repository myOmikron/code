packages:
  - frontend/*
  - components

allowBuilds:
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@swc/core': true
  '@tsparticles/engine': false
  esbuild: true
  onnxruntime-node: true
  sharp: true
  tesseract.js: true

catalogs:
  dependencies:
    '@headlessui/react': ^2.2.10
    '@heroicons/react': ^2.2.0
    '@simplewebauthn/browser': ^13.3.0
    '@techstark/opencv-js': ^5.0.0-release.1
    '@tanstack/react-form': ^1.33.0
    '@tanstack/react-query': ^5.102.3
    '@tanstack/react-router': ^1.170.17
    '@tanstack/react-table': ^9.0.0
    '@zxcvbn-ts/core': ^3.0.4
    '@zxcvbn-ts/language-common': ^3.0.4
    '@zxcvbn-ts/language-de': ^3.0.2
    '@zxcvbn-ts/language-en': ^3.0.2
    clsx: ^2.1.1
    i18next: ^26.3.4
    i18next-browser-languagedetector: ^8.2.1
    i18next-http-backend: ^4.0.0
    jsqr: ^1.4.0
    mdast-util-from-markdown: ^2.0.2
    mdast-util-to-string: ^4.0.0
    motion: ^14.0.0
    # WebGPU is unusable on ARM Mali gen-5: every arrangement returns non-finite values, while
    # that device's own compute shaders are provably correct. 1.30.0-dev was tried and behaves the
    # same, so there is nothing to gain from a nightly and the scanner falls back to WASM instead.
    onnxruntime-web: ^1.27.0
    qrcode.react: ^4.2.0
    react: ^19.2.7
    react-dom: ^19.2.7
    react-i18next: ^17.0.8
    react-markdown: ^10.1.0
    react-toastify: ^11.1.0
    recharts: ^3.8.1
    tesseract.js: ^5.1.1
    tesseract.js-core: ^6.0.0
  devDependencies:
    '@eslint/js': 10.0.1
    '@openapitools/openapi-generator-cli': 2.41.0
    '@tailwindcss/vite': ^4.3.2
    '@tanstack/router-devtools': ^1.167.0
    '@tanstack/router-plugin': ^1.168.19
    '@types/react': 19.2.15
    '@types/react-dom': 19.2.3
    '@vitejs/plugin-react': 6.0.3
    '@vitejs/plugin-react-swc': 4.3.3
    esbuild: 0.28.1
    eslint: 10.13.0
    onnxruntime-node: 1.30.0
    eslint-plugin-jsdoc: 63.3.3
    eslint-plugin-react-refresh: 0.5.7
    prettier: 3.8.4
    prettier-plugin-tailwindcss: 0.8.1
    sharp: ^0.35.0
    stream-json: ^3.0.0
    tailwindcss: 4.3.3
    typescript: 6.0.3
    typescript-eslint: 8.71.2
    vite: 8.1.0
    vite-plugin-pwa: 2.0.0
    vite-plugin-static-copy: 4.1.1
    vite-plugin-svgr: 5.2.0
    vitest: ^3.2.4
    yaml: 2.9.1
    workbox-window: ^7.4.1

linkWorkspacePackages: true

saveExact: true

savePrefix: ''
