[package]
name = "semmelei"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
service-bootstrap = { workspace = true }
galvyn = { workspace = true, default-features = true }

# Identity and passkey login
galvyn-identity = { workspace = true, features = ["passkey"] }

# Central NATS subject constants
nats-subjects = { workspace = true }

# Protobuf (de)serialization of NATS payloads
prost = { workspace = true }

# NATS client, for the `PublishError` the mail helper returns
async-nats = { workspace = true }

# Cli parser
clap = { workspace = true }

# Serialization and deserialization library
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
url = { workspace = true }

# Order deadlines are wall-clock times in Europe/Berlin, so they have to
# survive the DST switch — that needs real timezone data, not a fixed offset.
time-tz = { workspace = true }

# Logging facade
tracing = { workspace = true }

# Async
tokio = { workspace = true }

# Pickup code generation
rand = { version = "~0.10" }

# Item image uploads: decode (jpeg/png/webp), downscale, re-encode as jpeg
image = { version = "~0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = { workspace = true }

[build-dependencies]
service-bootstrap-build = { workspace = true }

[lints]
workspace = true
