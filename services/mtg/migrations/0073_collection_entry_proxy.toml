CREATE OR REPLACE FUNCTION collection_stock_entry() RETURNS trigger LANGUAGE plpgsql AS $$
BEGIN
    IF TG_OP IN ('DELETE', 'UPDATE') AND NOT OLD.proxy THEN
        PERFORM collection_stock_add(OLD.collection, OLD.printing, OLD.finish, -OLD.quantity::bigint);
    END IF;
    IF TG_OP IN ('INSERT', 'UPDATE') AND NOT NEW.proxy THEN
        PERFORM collection_stock_add(NEW.collection, NEW.printing, NEW.finish, NEW.quantity::bigint);
    END IF;
    RETURN NULL;
END;
$$;
"""

