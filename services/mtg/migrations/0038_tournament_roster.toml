# One account registers at most once per tournament. Guests share the null in
# `account`, so the index has to be partial — rorm has no composite unique
# annotation, and a plain unique index would let only one guest ever exist.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_participant_account ON tournament_participant (tournament, account) WHERE account IS NOT NULL;
"""

# An account holds at most one organizer row per tournament — same
# composite-unique gap, but no null to work around, so no WHERE clause.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_organizer_account ON tournament_organizer (tournament, account);
"""
