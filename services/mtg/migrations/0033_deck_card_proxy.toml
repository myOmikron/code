# Whether a deck slot is a proxy — a stand-in the owner does not really hold.
#
# A proxy is played but not owned: it is printed on paper for the table and
# sleeved up like any other card, but it names nothing in the collection. From
# here on sourcing stops asking anyone to go find it, and a deck's value stops
# counting it — the two places a deck list otherwise assumes every slot is real
# cardboard.
#
# Every card already in a deck is the genuine article, which is what the
# default says.

