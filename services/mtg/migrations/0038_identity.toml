# Passkeys and registration links hang off an identity instead of the account.
#
# The identity is the anchor the shared passkeys module will own: it carries no
# name, role or contact data, and the account references it through a unique,
# cascading foreign key. Deleting the identity takes the account, its passkeys
# and its registration links with it. The tables already carry the names the
# module will use, so moving the models into it needs no further migration.
#
# Every existing account gets an identity with the account's own uuid. That uuid
# is the WebAuthn user handle of the account's passkeys, and the value of the
# logged-in session key, so both keep working unchanged.
#
# A not-null column can't be added to a table that has rows, so the account
# table is rebuilt instead: the old one is renamed aside, a new one is created
# with the identity column, the rows are copied over, every foreign key that
# pointed at the old table is pointed at the new one, and the old one is
# dropped. Dropping it fails while anything still references it.
#
# Postgres only, like every deployment of this service.

