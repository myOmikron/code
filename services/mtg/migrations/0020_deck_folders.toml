# Every deck that was put away moves onto a shelf of its own, one archive per
# account that has one. Postgres mints the folder's key; the other two dialects
# borrow the key of one of the decks going into it, which is unused in
# deck_folder and saves depending on a uuid function they spell differently.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
INSERT INTO deck_folder (uuid, owner, name, kind, created_at)
SELECT MIN(d.uuid), d.owner, 'Archived', 'Archive', CURRENT_TIMESTAMP
FROM deck d
WHERE d.archived
GROUP BY d.owner;
"""
Postgres = """
INSERT INTO deck_folder (uuid, owner, name, kind, created_at)
SELECT gen_random_uuid(), d.owner, 'Archived', 'Archive', NOW()
FROM deck d
WHERE d.archived
GROUP BY d.owner;
"""
MySQL = """
INSERT INTO deck_folder (uuid, owner, name, kind, created_at)
SELECT MIN(d.uuid), d.owner, 'Archived', 'Archive', CURRENT_TIMESTAMP
FROM deck d
WHERE d.archived = 1
GROUP BY d.owner;
"""

# The flag itself is dropped below, so this is the only chance to read it.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
UPDATE deck
SET folder = (
    SELECT f.uuid FROM deck_folder f
    WHERE f.owner = deck.owner AND f.kind = 'Archive'
)
WHERE archived;
"""
Postgres = """
UPDATE deck
SET folder = f.uuid
FROM deck_folder f
WHERE f.owner = deck.owner AND f.kind = 'Archive' AND deck.archived;
"""
MySQL = """
UPDATE deck d
JOIN deck_folder f ON f.owner = d.owner AND f.kind = 'Archive'
SET d.folder = f.uuid
WHERE d.archived = 1;
"""

