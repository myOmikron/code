# Existing assignments of global tags become one card-level assignment per
# card identity. The stored printing remains the anchor for future catalog
# refreshes; reads resolve its oracle id or normalized name dynamically.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
INSERT INTO global_card_tag (uuid, tag, printing)
SELECT MIN(a.uuid), a.tag, MIN(c.printing)
FROM deck_card_tag a
JOIN deck_tag t ON t.uuid = a.tag
JOIN deckcard c ON c.uuid = a.deck_card
LEFT JOIN printing p ON p.id = c.printing
WHERE t.deck IS NULL
GROUP BY a.tag, CASE
    WHEN p.oracle_id IS NOT NULL THEN 'o:' || p.oracle_id
    WHEN p.id IS NOT NULL THEN 'n:' || p.name_sort
    ELSE 'p:' || c.printing
END;
"""
