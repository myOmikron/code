# What the account owns, added up once instead of on every read.
#
# Every question of the form "how many of this card do I have free" used to be
# answered by scanning the whole of `collection_entry` for the account, joined
# to the catalog, once per row of the answer — a watch list with two entries on
# a 20k-card collection spent 1.5 seconds in the database for a 1 KB reply, and
# the cost grows with the collection rather than with the list. This table holds
# the same number already added up: one row per (owner, printing, finish),
# carrying what lies on a shelf and what is sleeved up in a deck.
#
# Kept by the database rather than by the service on purpose. Cards leave a
# collection in ways no handler ever sees: deleting a collection cascades to its
# entries, deleting a deck cascades to its collection, and a printing merge
# rewrites the column from a migration. A trigger is the only place that catches
# all of them, so the rollup cannot quietly drift from the truth. `check-stock`
# is the command that proves it still has not.
#
# One statement per step: a raw step is handed to the database whole, so a
# function and the trigger that calls it cannot share one.
#
# Postgres only. The reads it serves are Postgres already — lateral joins,
# `FILTER`, `string_to_array` — so the other two dialects change nothing here
# rather than pretending to keep a table nothing would ever query.

# The rollup itself. The primary key leads with the owner, which is what every
# read filters on, so one account's stock is a range scan of its own rows and
# never a walk over everybody's.
#
# `StructureSafe` because rorm keeps no model for this table: it is derived data
# maintained by the database, and the reads reach it through hand-written sql
# like everything else in that module. An unsafe step would stop
# `make-migrations` from replaying the history at all.
