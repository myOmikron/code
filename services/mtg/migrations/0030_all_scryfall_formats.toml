# Widening `legal_formats` from 128 to 512 characters, because the catalog now
# tracks every format Scryfall reports rather than seven of them: a card legal
# in all of them spells out a little over two hundred characters.
#
# rorm has no operation for changing a column's width — the two structured steps
# in the middle are a drop and a fresh column, which would take every card's
# legality with them. The next `sync-catalog` would write it all back, but until
# that runs every card would read as legal nowhere: deck legality would warn on
# everything and the statistics would count zero. So the value is parked in a
# column of its own first and poured back afterwards.
#
# One statement per step, never two: rorm sends raw sql as a prepared statement,
# and Postgres takes exactly one command in one of those.
#
# `StructureSafe`, because the raw steps cancel each other out: the parking
# column is gone again by the end of the migration, and the structure rorm knows
# is exactly what its own two steps leave behind.

[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
