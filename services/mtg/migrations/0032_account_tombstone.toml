# The tombstone flag on an account.
#
# Deleting an account leaves the decks it put on show behind, handed to a single
# account nobody can reach: the decklists stay readable, the builder is gone.
# This marks that one row, so that no lookup by name ever answers with it.
#
# No account is a tombstone until the first deletion makes one, which is what
# the default says.

