CREATE OR REPLACE FUNCTION collection_stock_apply_collection(
    p_collection uuid,
    p_owner uuid,
    p_deck uuid,
    p_sign bigint
) RETURNS void LANGUAGE plpgsql AS $$
BEGIN
    INSERT INTO collection_stock AS s (owner, printing, finish, oracle_id, lang, free, sleeved)
    SELECT p_owner,
           e.printing,
           e.finish,
           MIN(mp.oracle_id),
           MIN(mp.lang),
           CASE WHEN p_deck IS NULL THEN p_sign * SUM(e.quantity) ELSE 0 END,
           CASE WHEN p_deck IS NULL THEN 0 ELSE p_sign * SUM(e.quantity) END
    FROM collection_entry e
    LEFT JOIN printing mp ON mp.id = e.printing
    WHERE e.collection = p_collection
    GROUP BY e.printing, e.finish
    ON CONFLICT (owner, printing, finish) DO UPDATE
        SET free = s.free + EXCLUDED.free,
            sleeved = s.sleeved + EXCLUDED.sleeved,
            oracle_id = COALESCE(EXCLUDED.oracle_id, s.oracle_id),
            lang = COALESCE(EXCLUDED.lang, s.lang);
END;
$$;
"""
