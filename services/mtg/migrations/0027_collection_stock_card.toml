CREATE OR REPLACE FUNCTION collection_stock_add(
    p_collection uuid,
    p_printing uuid,
    p_finish varchar,
    p_quantity bigint
) RETURNS void LANGUAGE plpgsql AS $$
DECLARE
    v_owner  uuid;
    v_deck   uuid;
    v_oracle uuid;
    v_lang   varchar;
BEGIN
    IF p_quantity = 0 THEN
        RETURN;
    END IF;

    SELECT c.owner, c.deck INTO v_owner, v_deck
    FROM collection c
    WHERE c.uuid = p_collection;

    IF v_owner IS NULL THEN
        RETURN;
    END IF;

    SELECT mp.oracle_id, mp.lang INTO v_oracle, v_lang
    FROM printing mp
    WHERE mp.id = p_printing;

    INSERT INTO collection_stock AS s (owner, printing, finish, oracle_id, lang, free, sleeved)
    VALUES (
        v_owner,
        p_printing,
        p_finish,
        v_oracle,
        v_lang,
        CASE WHEN v_deck IS NULL THEN p_quantity ELSE 0 END,
        CASE WHEN v_deck IS NULL THEN 0 ELSE p_quantity END
    )
    ON CONFLICT (owner, printing, finish) DO UPDATE
        SET free = s.free + EXCLUDED.free,
            sleeved = s.sleeved + EXCLUDED.sleeved,
            oracle_id = COALESCE(EXCLUDED.oracle_id, s.oracle_id),
            lang = COALESCE(EXCLUDED.lang, s.lang);
END;
$$;
"""

