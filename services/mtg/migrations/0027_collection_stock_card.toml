# The rollup answers for itself.
#
# `collection_stock` counted the copies but still had to ask the catalog which
# card and which language a row was about — a join per row, on every read. The
# two columns move that answer into the row, and the index below turns "every
# print of this card that I own" from a scan of the account's whole stock into a
# lookup. Measured on a 13,320-row account: 80 ms of the 380 the watch list took
# were those probes.
#
# The copies are kept current in three places: the triggers write them, this
# migration fills them for what is already there, and `sync-catalog` refreshes
# them once the catalog has moved. `check-stock` reports where they disagree.
#
# One statement per step, and Postgres only — see the migration before this one.

# The card behind a printing, kept in the rollup's own row.
#
# Every read of the rollup asks the same two things about a stack: which card is
# it, and in which language. Both live in the catalog, so answering them meant
# joining `printing` once per rollup row — for an account with thirteen thousand
# of them, thirteen thousand index probes to answer one watch list entry. They
# are copies, and the price of a copy is keeping it current: the triggers write
# them, and `sync-catalog` refreshes them after the catalog moves.
