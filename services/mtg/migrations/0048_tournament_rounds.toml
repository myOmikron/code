# rorm has no composite unique annotation, so every one of these is raw SQL —
# the same pattern as `tournament_participant_account` in 0038. One statement
# per step: Postgres refuses several commands in one prepared statement.

# One sequence number per event: `sequence` is "the nth round that happened here".
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_round_sequence ON tournament_round (tournament, sequence);
"""

# Partial on purpose: a draft or deckbuilding round carries `number = NULL`
# and an event may hold several. Postgres would allow that under a plain
# composite unique too, since NULLs never conflict — the `WHERE` states the
# intent rather than leaving it to be inherited by accident.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_round_number ON tournament_round (tournament, number) WHERE number IS NOT NULL;
"""

# Two tables cannot share a number inside one round.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_match_table ON tournament_match (round, table_number);
"""

# One player per seat.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_seat_seat ON tournament_seat (tournament_match, seat);
"""

# One seat per player at a table — nobody plays themselves.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_seat_participant ON tournament_seat (tournament_match, participant);
"""

# One claim per reporter per table, corrected in place.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_result_report_reporter ON tournament_result_report (tournament_match, reported_by);
"""

# Two immobile players pinned to the same table becomes a database refusal
# rather than a runtime surprise at the desk.
[[Migration.Operations]]
Type = "RawSQL"
StructureSafe = true
SQLite = """
SELECT 1;
"""
MySQL = """
SELECT 1;
"""
Postgres = """
CREATE UNIQUE INDEX tournament_participant_fixed_table ON tournament_participant (tournament, fixed_table) WHERE fixed_table IS NOT NULL;
"""
