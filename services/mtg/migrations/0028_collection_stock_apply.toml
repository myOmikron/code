# `MIN(uuid)` is not a thing.
#
# The previous migration reached for it to carry the card's id through a
# `GROUP BY` — and Postgres has no `min` for `uuid`, so every path that applies a
# whole collection at once died the moment it ran: a collection being deleted, or
# becoming a deck's. The grouping never needed it. `oracle_id` and `lang` follow
# from the printing, not from the group, so the sum is taken first and the
# catalog joined to the result.
#
# Replacing the function is enough — the triggers point at it by name.

