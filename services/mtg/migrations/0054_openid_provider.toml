        SELECT indexname FROM pg_indexes
        WHERE tablename = 'external_identity_old'
            AND left(indexname, 22) <> 'external_identity_old_'
    LOOP
        EXECUTE format(
            'ALTER INDEX %I RENAME TO %I',
            r.indexname,
            'external_identity_old_' || substr(r.indexname, 19)
        );
    END LOOP;
END
$$;
