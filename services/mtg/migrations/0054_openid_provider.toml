Postgres = """
INSERT INTO openid_provider (uuid, slug, display_name, discovery_url, issuer, client_id, client_secret, identifying_claim, admission, created_at)
SELECT gen_random_uuid(), 'google', 'Google', 'https://accounts.google.com/.well-known/openid-configuration', 'https://accounts.google.com', 'set-from-env-at-startup', 'set-from-env-at-startup', 'sub', 'open', now()
WHERE EXISTS (SELECT 1 FROM external_identity_old);

INSERT INTO external_identity (uuid, identity, provider, issuer, value, provider_value, created_at)
SELECT o.uuid, o.identity, p.uuid, o.issuer, o.subject, p.uuid::text || ' ' || o.subject, o.created_at
FROM external_identity_old o
JOIN openid_provider p ON p.slug = 'google';
"""

