[package]
name = "mtg"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Niklas Pfister <git@omikron.dev>"]

[dependencies]
service-bootstrap = { workspace = true }
galvyn = { workspace = true, default-features = true }

# WebAuthn server-side ceremonies (passkey-only login).
# danger-allow-state-serialisation: ceremony states are stored in the
# (server-side, rorm-backed) session between start and finish.
webauthn-rs = { version = "~0.5", features = ["danger-allow-state-serialisation"] }
# The wire types behind `webauthn-rs`. Needed to raise the credential to a discoverable
# one — `ResidentKeyRequirement` is not part of webauthn-rs' prelude.
webauthn-rs-proto = "~0.5"

# CBOR, to read the AAGUID out of the raw attestation object. webauthn-rs parses it but
# only keeps it for attested registrations — see `registration_aaguid`.
serde_cbor_2 = "0.13"

# Session store behind galvyn's session layer. Needed to name `Expiry` — galvyn keeps it
# private, so a per-session lifetime cannot be set through it.
tower-sessions = "0.15"

# Response compression — a collection's entries run to megabytes of json
tower-http = { workspace = true }

# Central NATS subject constants
nats-subjects = { workspace = true }

# Protobuf (de)serialization of NATS payloads
prost = { workspace = true }

# NATS client, for the `PublishError` the mail helper returns
async-nats = { workspace = true }

# Cli parser
clap = { workspace = true }

# Serialization and deserialization library
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Logging facade
tracing = { workspace = true }

# Http client, for pulling Scryfall's bulk catalog
reqwest = { workspace = true }

# Scryfall serves its bulk files as gzip *files*, not as a gzip transfer
# encoding, so the client hands them over still packed.
async-compression = { version = "~0.4", features = ["tokio", "gzip"] }

# Bridges the download's byte stream into something the decoder can read
tokio-util = { workspace = true, features = ["io"] }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# Registration token generation
rand = { workspace = true }

# Bracket-flag patterns over oracle text, applied once per catalog sync
regex = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# webauthn-rs links OpenSSL; build and link it statically so the
# musl release binary works in the hardened (libless) runtime image.
openssl = { version = "~0.10", features = ["vendored"] }

[build-dependencies]
service-bootstrap-build = { workspace = true }

[lints]
workspace = true
