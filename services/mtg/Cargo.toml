[package]
name = "mtg"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
authors = ["Niklas Pfister <git@omikron.dev>"]

[dependencies]
service-bootstrap = { workspace = true }
galvyn = { workspace = true, default-features = true, features = ["rorm-postgres-only"] }

# Identity, passkey and OIDC login
galvyn-identity = { workspace = true, features = ["passkey", "oidc"] }

# Response compression — a collection's entries run to megabytes of json
tower-http = { workspace = true }

# Central NATS subject constants
nats-subjects = { workspace = true }

# Protobuf (de)serialization of NATS payloads
prost = { workspace = true }

# NATS client, for the `PublishError` the mail helper returns
async-nats = { workspace = true }

# Cli parser
clap = { workspace = true }

# Serialization and deserialization library
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Logging facade
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Http client, for pulling Scryfall's bulk catalog
reqwest = { workspace = true }

# Scryfall serves its bulk files as gzip *files*, not as a gzip transfer
# encoding, so the client hands them over still packed.
async-compression = { version = "~0.4", features = ["tokio", "gzip"] }

# Bridges the download's byte stream into something the decoder can read
tokio-util = { workspace = true, features = ["io"] }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# Registration token generation
rand = { workspace = true }

# Bracket-flag patterns over oracle text, applied once per catalog sync
regex = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
galvyn-identity = { workspace = true, features = ["passkey", "oidc", "test-support"] }
sqlx = { workspace = true }
tower = { version = "~0.5", features = ["util"] }

[build-dependencies]
service-bootstrap-build = { workspace = true }

[lints]
workspace = true
