[package]
name = "mtg"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Niklas Pfister <git@omikron.dev>"]

[dependencies]
service-bootstrap = { workspace = true }
galvyn = { workspace = true, default-features = true }

# WebAuthn server-side ceremonies (passkey-only login).
# danger-allow-state-serialisation: ceremony states are stored in the
# (server-side, rorm-backed) session between start and finish.
webauthn-rs = { version = "~0.5", features = ["danger-allow-state-serialisation"] }

# Central NATS subject constants
nats-subjects = { workspace = true }

# Protobuf (de)serialization of NATS payloads
prost = { workspace = true }

# NATS client, for the `PublishError` the mail helper returns
async-nats = { workspace = true }

# Cli parser
clap = { workspace = true }

# Serialization and deserialization library
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

# Logging facade
tracing = { workspace = true }

# Async
tokio = { workspace = true }

# Registration token generation
rand = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# webauthn-rs links OpenSSL; build and link it statically so the
# musl release binary works in the hardened (libless) runtime image.
openssl = { version = "~0.10", features = ["vendored"] }

[build-dependencies]
service-bootstrap-build = { workspace = true }

[lints]
workspace = true
