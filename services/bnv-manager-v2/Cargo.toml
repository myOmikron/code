[package]
name = "bnv-manager-v2"
version = "0.1.0"
edition = "2024"
authors = ["Niklas Pfister <git@omikron.dev>"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Webframework
tower = { version = "~0.5", features = ["limit"] }
tower-http = { workspace = true }
galvyn = { workspace = true, features = ["contrib-settings"] }
service-bootstrap = { workspace = true }

# Account authentication
# webauthn-rs = { version = "~0.5", features = ["danger-allow-state-serialisation"] } # The feature is necessary as we want to save the state to a database
bcrypt = { version = "~0.19" }
rand = { version = "~0.10.0" }
jsonwebtoken = { version = "~11", features = ["rust_crypto"] }
rsa = { version = "~0.9", features = ["pem"] }
sha2 = { workspace = true }
base64ct = { version = "~1", features = ["std"] }
zxcvbn = { version = "~3" }
# Constant time for crypto
subtle = { workspace = true }

# Cli
clap = { workspace = true }

# Logging
tracing = { workspace = true }

# Datatypes
uuid = { workspace = true }
url = { workspace = true }
time = { workspace = true }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Mailcow API
mailcow = { workspace = true }
